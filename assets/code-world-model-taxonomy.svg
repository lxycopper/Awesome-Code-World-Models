  <text x="1322" y="1055" class="ol"><tspan class="ol-name">Genie</tspan> — generative interactive environments · ICML 2024</text>
  <text x="1302" y="1081" class="note" fill="#be185d">Kept as context — not Code World Models.</text>

  <!-- The Boundary -->
  <rect x="1270" y="1118" width="580" height="124" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1302" y="1150" class="sg" fill="#64748b">THE BOUNDARY</text>
  <text x="1302" y="1176" class="c-sub">Representation, not appearance: simple visuals qualify when dynamics are</text>
  <text x="1302" y="1200" class="c-sub">executable; photorealistic video is adjacent when state stays implicit.</text>

  <!-- Footer -->
  <text x="60" y="1284" class="footer">Awesome Code World Models — github.com/lxycopper/Awesome-Code-World-Models</text>
  <text x="1860" y="1284" text-anchor="end" class="footer">Solid border = core taxonomy · Dashed border = adjacent context</text>
