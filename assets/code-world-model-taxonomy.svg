  <text x="1302" y="926" class="c-sub">Rendering and action-conditioning context — no executable state</text>
  <line x1="1302" y1="940" x2="1818" y2="940" stroke="#f9a8d4"/>
  <circle cx="1306" cy="964" r="3.5" fill="#db2777"/>
  <text x="1322" y="968" class="ol"><tspan class="ol-name">YUME</tspan> — interactive world generation · 2025</text>
